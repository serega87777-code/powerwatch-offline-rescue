<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PowerWatch X Offline Rescue — project banner</title>
  <desc>Dark banner with a watch silhouette and BLE signal arcs on the left, project title and tagline on the right</desc>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Subtle grid lines -->
  <g stroke="#1c2333" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>

  <!-- Watch body -->
  <g transform="translate(100, 100)">
    <!-- Lugs top -->
    <rect x="-12" y="-68" width="8" height="18" rx="3" fill="#21262d"/>
    <rect x="4" y="-68" width="8" height="18" rx="3" fill="#21262d"/>
    <!-- Lugs bottom -->
    <rect x="-12" y="50" width="8" height="18" rx="3" fill="#21262d"/>
    <rect x="4" y="50" width="8" height="18" rx="3" fill="#21262d"/>
    <!-- Watch case -->
    <circle r="58" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <!-- Bezel ring -->
    <circle r="50" fill="none" stroke="#21262d" stroke-width="2"/>
    <!-- Bezel tick marks -->
    <g stroke="#30363d" stroke-width="1.5">
      <line x1="0" y1="-50" x2="0" y2="-44"/>
      <line x1="50" y1="0" x2="44" y2="0"/>
      <line x1="0" y1="50" x2="0" y2="44"/>
      <line x1="-50" y1="0" x2="-44" y2="0"/>
    </g>
    <!-- Screen -->
    <circle r="42" fill="#0a0e14"/>
    <!-- Crown -->
    <rect x="56" y="-6" width="10" height="12" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>

    <!-- BLE signal arcs (right side) -->
    <g fill="none" stroke="#238636" stroke-linecap="round">
      <path d="M 48 -12 Q 62 0 48 12" stroke-width="2.5" opacity="0.5"/>
      <path d="M 52 -20 Q 72 0 52 20" stroke-width="2" opacity="0.35"/>
      <path d="M 56 -28 Q 82 0 56 28" stroke-width="1.5" opacity="0.2"/>
    </g>

    <!-- Time display -->
    <text x="0" y="-8" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#58a6ff" letter-spacing="2">03:22</text>
    <!-- Date -->
    <text x="0" y="10" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="8" fill="#8b949e" letter-spacing="1">SAT 19</text>
    <!-- Status dot -->
    <circle cx="0" cy="24" r="3" fill="#238636"/>
  </g>

  <!-- Divider -->
  <line x1="185" y1="30" x2="185" y2="170" stroke="#21262d" stroke-width="1.5"/>

  <!-- Text content -->
  <g transform="translate(215, 0)">
    <!-- Tag line small -->
    <text x="0" y="52" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e" letter-spacing="2">COMMUNITY · INTEROPERABILITY</text>

    <!-- Main title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">PowerWatch X</text>
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#58a6ff">Offline Rescue</text>

    <!-- Bottom line -->
    <text x="0" y="162" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950" letter-spacing="1">BLE · time sync · save · SOFF exit</text>
  </g>

  <!-- Top-right badge -->
  <g transform="translate(660, 30)">
    <rect width="110" height="24" rx="12" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#238636"/>
    <text x="26" y="16" font-family="'SF Mono', monospace" font-size="10" fill="#3fb950">verified flow</text>
  </g>

  <!-- Bottom-right: SHA hint -->
  <text x="770" y="185" text-anchor="end" font-family="'SF Mono', monospace" font-size="9" fill="#30363d">06efbc5c…</text>
</svg>
